services:
  - type: web
    name: ai-workforce
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app run.py db upgrade
    startCommand: python scripts/production_check.py && gunicorn -c gunicorn.conf.py run:app
    healthCheckPath: /readyz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workforce-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FILE_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-workforce-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: redis
          name: ai-workforce-redis
          property: connectionString
      - key: MFA_ISSUER
        value: AI Workforce
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY_COUNT
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: SECURITY_EVENT_RETENTION_DAYS
        value: "180"
      - key: PLATFORM_ADMIN_LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: PLATFORM_ADMIN_LOCKOUT_MINUTES
        value: "15"
      - key: PLATFORM_ADMIN_MFA_MAX_ATTEMPTS
        value: "5"
      - key: PLATFORM_ADMIN_MFA_LOCKOUT_MINUTES
        value: "15"

  - type: worker
    name: ai-workforce-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/production_check.py && celery -A worker.celery worker --loglevel=INFO --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        fromService:
          type: web
          name: ai-workforce
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workforce-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: eu-north-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FILE_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-workforce-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      # scripts/production_check.py (run before the worker starts) requires these.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: redis
          name: ai-workforce-redis
          property: connectionString
  - type: redis
    name: ai-workforce-redis
    plan: starter
    ipAllowList: []  # internal connections only, from this workspace's services
    maxmemoryPolicy: noeviction  # Redis is the Celery broker; eviction would silently drop queued tasks

  - type: cron
    name: ai-workforce-expiry-job
    runtime: python
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py process-subscription-expirations
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        fromService:
          type: web
          name: ai-workforce
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workforce-db
          property: connectionString

  - type: cron
    name: ai-workforce-security-retention
    runtime: python
    schedule: "30 2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py purge-security-events
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        fromService:
          type: web
          name: ai-workforce
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workforce-db
          property: connectionString

databases:
  - name: ai-workforce-db
    databaseName: ai_workforce
    user: ai_workforce
