{% extends 'base.html' %}
{% block title %}Verify sign-in · Platform Administration{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <p class="eyebrow">PLATFORM ADMINISTRATION</p>
  <h1>Enter your code</h1>
  <p class="muted">Enter the six-digit code from your authenticator application.</p>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="code">Authentication code</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="12">
    <button class="primary" type="submit">Continue</button>
  </form>
</section></div>
{% endblock %}
