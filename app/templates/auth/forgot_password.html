{% extends "base.html" %}
{% block title %}Reset password · AI Workforce{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <p class="eyebrow">ACCOUNT RECOVERY</p>
  <h1>Reset password</h1>
  <p class="muted">Enter your work email and we'll send a reset link if an account exists.</p>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Work email<input name="email" type="email" autocomplete="email" required></label>
    <button class="primary" type="submit">Send reset link</button>
  </form>
  <div class="auth-links"><a href="{{ url_for('auth.login') }}">← Back to sign in</a></div>
</section></div>
{% endblock %}
