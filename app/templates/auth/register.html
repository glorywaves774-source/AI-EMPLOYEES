{% extends "base.html" %}
{% block title %}Create business workspace · AI Workforce{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <p class="eyebrow">KAYRON GLOBAL TECH SERVICES</p>
  <h1>Create your AI workforce</h1>
  <p class="muted">Register your business and establish its private workspace.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Full name<input name="full_name" autocomplete="name" required></label>
    <label>Work email<input type="email" name="email" autocomplete="email" required></label>
    <label>Business name<input name="business_name" autocomplete="organization" required></label>
    <label>Password <small>(at least 12 characters)</small><input type="password" name="password" minlength="12" autocomplete="new-password" required></label>
    <label class="inline-choice consent"><input type="checkbox" name="accept_terms" value="yes" required> <span>I agree to the <a href="{{ url_for('legal.terms') }}" target="_blank" rel="noopener">terms of use</a> and <a href="{{ url_for('legal.privacy') }}" target="_blank" rel="noopener">privacy policy</a>, on behalf of my business.</span></label>
    <button class="primary" type="submit">Create workspace</button>
  </form>
  <div class="auth-links"><span>Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></span></div>
</section></div>
{% endblock %}
