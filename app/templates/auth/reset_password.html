{% extends "base.html" %}
{% block title %}Choose a new password · AI Workforce{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="auth-card">
  <p class="eyebrow">ACCOUNT RECOVERY</p>
  <h1>Choose a new password</h1>
  <p class="muted">Use at least 12 characters.</p>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>New password<input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
    <button class="primary" type="submit">Reset password</button>
  </form>
</section></div>
{% endblock %}
